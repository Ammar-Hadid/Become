services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: become
      POSTGRES_PASSWORD: become
      POSTGRES_DB: become
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - become_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U become -d become"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  become_postgres:
