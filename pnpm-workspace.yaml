allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
  unrs-resolver: true
confirmModulesPurge: false
# Security fixes for transitive Prisma CLI / optional MySQL dependencies.
# Revisit when upstream ranges include these patched versions.
overrides:
  "deepmerge-ts@<8.0.0": "8.0.0"
  "mysql2@<3.23.1": "3.23.1"
minimumReleaseAgeExclude:
  - "@vitest/mocker@5.0.0"
  - "@vitest/spy@5.0.0"
  - vitest@5.0.0
